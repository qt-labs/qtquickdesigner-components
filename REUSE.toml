version = 1

[[annotations]]
path = ["**/CMakeLists.txt", "**.cmake", "**.conf", "**.cfg", "**.pro",
        "**.pri", "**.prf", "**.yaml", "**.yml", ".qmake.conf", ".tag",
        "sync.profile", "CMakeLists.txt.shared", "python/MANIFEST.in",
        "python/requirements.txt"]
comment = "build system"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (C) The Qt Company Ltd."
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["**/.gitattributes", "**.gitignore", "**/.gitreview", ".gitmodules"]
precedence = "closest"
comment = "infrastructure"
SPDX-FileCopyrightText = "Copyright (C) The Qt Company Ltd."
SPDX-License-Identifier = "LicenseRef-Qt-Commercial OR BSD-3-Clause"

[[annotations]]
path = ["**/README", "**/README.md", "**/README.txt", "**.qdocconf"]
comment = "documentation"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (C) The Qt Company Ltd."
SPDX-License-Identifier = "LicenseRef-Qt-Commercial OR GFDL-1.3-no-invariants-only"

[[annotations]]
path = ["**.qdoc", "**/doc/**/images/**", "**/doc/**.css"]
comment = "documentation"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (C) The Qt Company Ltd."
SPDX-License-Identifier = "LicenseRef-Qt-Commercial OR GFDL-1.3-no-invariants-only"

[[annotations]]
path = ["**/qmldir"]
comment = "qml module metadata"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (C) The Qt Company Ltd."
SPDX-License-Identifier = "LicenseRef-Qt-Commercial OR GPL-3.0-only"

[[annotations]]
path = ["src/imports/**/plugins.qmltypes", "src/imports/**/designer/**.metainfo",
        "src/imports/**/designer/images/**", "src/imports/designeffects/shaders/**"]
comment = "qml tooling and designer metadata"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (C) The Qt Company Ltd."
SPDX-License-Identifier = "LicenseRef-Qt-Commercial OR GPL-3.0-only"

[[annotations]]
path = ["examples/**/*.qmlproject", "examples/**.metainfo",
        "examples/TransitionItem/images/shuttle*.jpg"]
comment = "examples"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (C) The Qt Company Ltd."
SPDX-License-Identifier = "LicenseRef-Qt-Commercial OR BSD-3-Clause"

[[annotations]]
path = ["examples/TransitionItem/FontAwesome.otf"]
comment = "Font Awesome font asset"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright Dave Gandy 2016. All rights reserved."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["examples/TransitionItem/images/svg/*.svg"]
comment = "Font Awesome SVG assets"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright Dave Gandy 2016. All rights reserved."
SPDX-License-Identifier = "CC-BY-3.0"

[[annotations]]
path = ["python/configure.py", "python/setup.py"]
comment = "python packaging scripts"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (C) The Qt Company Ltd."
SPDX-License-Identifier = "LicenseRef-Qt-Commercial OR LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"

[[annotations]]
path = ["**.toml", "licenseRule.json"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) The Qt Company Ltd."
SPDX-License-Identifier = "LicenseRef-Qt-Commercial OR BSD-3-Clause"

[[annotations]]
path = ["REUSE.toml"]
comment = "reuse metadata"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) The Qt Company Ltd."
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [".tag"]
comment = "git archive placeholder metadata"
precedence = "override"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["python/artifacts/pyproject.toml.base"]
comment = "python packaging metadata"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) The Qt Company Ltd."
SPDX-License-Identifier = "LicenseRef-Qt-Commercial OR GPL-3.0-only WITH Qt-GPL-exception-1.0"

[[annotations]]
path = ["LICENSES/**", "**LICENSE*"]
precedence = "override"
comment = "License file."
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"
